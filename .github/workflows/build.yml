name: Build Installers

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build application
        run: npm run build

      - name: Package for Windows
        run: npx electron-builder --win --publish never

      - name: Remove existing release assets
        shell: bash
        run: |
          tag="${{ github.event.release.tag_name || github.ref_name }}"
          release_id=$(gh api repos/${GITHUB_REPOSITORY}/releases/tags/${tag} --jq '.id' 2>/dev/null || echo "")
          if [ -z "$release_id" ] || [ "$release_id" = "null" ]; then
            echo "No existing release for tag ${tag}; skipping asset cleanup."
            exit 0
          fi
          echo "Release ID: ${release_id}"
          gh api repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets \
            --jq '.[] | select(.name | endswith(".exe")) | "\(.id)\t\(.name)"' | \
          while IFS=$'\t' read -r asset_id asset_name; do
            echo "Deleting existing asset: ${asset_name} (id: ${asset_id})"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: release/*.exe
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
